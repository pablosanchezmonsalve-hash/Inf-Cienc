<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe Cienciométrico Institucional</title>
<meta name="description" content="Producción, impacto, colaboración y áreas temáticas de la actividad científica institucional.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<script>/* Corre antes de pintar, y las dos cosas que hace tienen que ocurrir antes.
   1. El tema guardado: desde el módulo diferido, la página aparecería un
      instante con el tema equivocado.
   2. La clase `js`: marca que hay JavaScript. Las vistas conmutables se
      contraen a una sola sólo bajo esa clase; sin JS se muestran las dos, que
      es lo correcto —la tabla es la vía equivalente al gráfico, no un extra—. */
(function(){var e=document.documentElement;e.className+=' js';
try{var t=localStorage.getItem('tema');if(t)e.setAttribute('data-tema',t)}catch(x){}})();</script>
</head>
<body data-pagina="portada">
<a class="salto-contenido" href="#contenido">Saltar al contenido</a>
<header class="cabecera" id="cabecera"></header>
<div class="vigencia" id="vigencia"></div>
<main id="contenido" class="contenedor">
  <!-- LA PORTADA ES UN EXPLORADOR, no un informe que se lee de arriba abajo.
       El lector elige el recorte y todas las cifras y gráficos se recalculan
       sobre él, en el navegador, desde publications.json.

       El pre-renderizado deja escrito el estado SIN FILTRAR, que es el informe
       completo: sin JavaScript se ve exactamente eso, con sus cifras y sus
       gráficos. La interacción se añade encima. Los `details` de los filtros
       se abren y se leen sin guion, que es la razón de usarlos. -->
  <header class="portada-cabecera">
    <div id="titular"></div>
  </header>

  <div id="estado-recorte"></div>

  <div class="explorador">
    <aside class="explorador-panel" aria-label="Filtros">
      <h2 class="solo-lectores">Filtrar las publicaciones</h2>
      <div id="controles"></div>
    </aside>

    <div class="explorador-resultado">
      <h2 class="solo-lectores">Indicadores del recorte</h2>
      <div id="cifras"></div>

      <h2 class="titulo-seccion">Cómo se reparte</h2>
      <div class="cortes" id="cortes"></div>

      <details class="metodo" id="lectura"></details>
    </div>
  </div>

  <div id="cierre"></div>
</main>
<footer class="pie" id="pie"></footer>
<script type="module" src="assets/js/paginas.js"></script>
</body>
</html>
