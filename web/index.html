<!doctype html>
<html lang="es">
<head data-titulo="Informe Bibliométrico Institucional"
      data-descripcion="Producción, impacto, colaboración y áreas temáticas de la actividad científica institucional."></head>
<body data-pagina="portada">
<a class="salto-contenido" href="#contenido">Saltar al contenido</a>
<header class="cabecera" id="cabecera"></header>
<div class="vigencia" id="vigencia"></div>
<main id="contenido" class="contenedor">
  <!-- LA PORTADA ES UN EXPLORADOR, no un informe que se lee de arriba abajo.
       El lector elige el recorte y todas las cifras y gráficos se recalculan
       sobre él, en el navegador, desde publications.json.

       El pre-renderizado deja escrito el estado SIN FILTRAR, que es el informe
       completo: sin JavaScript se ve exactamente eso, con sus cifras y sus
       gráficos. La interacción se añade encima. Los `details` de los filtros
       se abren y se leen sin guion, que es la razón de usarlos. -->
  <header class="portada-cabecera">
    <div id="titular"></div>
  </header>

  <div class="minifoco" id="minifoco" aria-label="Exploración rápida"></div>

  <div id="estado-recorte"></div>

  <div class="explorador">
    <aside class="explorador-panel" aria-label="Filtros">
      <h2 class="solo-lectores">Filtrar las publicaciones</h2>
      <div id="controles"></div>
    </aside>

    <div class="explorador-resultado">
      <h2 class="solo-lectores">Indicadores del recorte</h2>
      <div id="cifras"></div>

      <h2 class="titulo-seccion">Cómo se reparte</h2>
      <div class="cortes" id="cortes"></div>

      <details class="metodo" id="lectura"></details>
    </div>
  </div>

  <!-- El informe completo en PDF, cuando la corrida que construyó el sitio
       también lo generó. Va vacío a propósito y NO lo rellena el
       pre-renderizador: el informe se compone DESPUÉS del sitio, porque
       necesita el sitio para componerse, así que a la hora de escribir esta
       página todavía no se sabe si existe ni cuántas hojas tiene. Lo rellena
       `paginas.js` leyendo `data/informe.json`, el manifiesto que deja el
       generador; sin manifiesto no hay bloque, que es lo que impide ofrecer
       un enlace a un archivo que no está o que es de otra carga de datos.

       VA AL FINAL, Y NO ARRIBA. Empezó justo bajo el titular y ahí DUPLICÓ el
       LCP de la portada: 3.156 ms contra 1.420 ms, con su propio párrafo como
       elemento de mayor pintado. La causa es estructural y no se arregla
       optimizando: el bloque no puede pre-renderizarse —su manifiesto no
       existe cuando se escribe esta página— así que siempre pinta tarde, tras
       el guion y dos peticiones. Arriba y grande, eso lo convierte en el
       elemento que define el LCP. Abajo del pliegue no es candidato, y la
       portada recupera su titular pre-renderizado.

       No es una pérdida: quien viene a por el informe entero en PDF no es el
       visitante de la primera pantalla. -->
  <section class="informe-pdf" id="informe-pdf" hidden></section>

  <div id="cierre"></div>
</main>
<footer class="pie" id="pie"></footer>
<script type="module" src="assets/js/paginas.js"></script>
</body>
</html>
