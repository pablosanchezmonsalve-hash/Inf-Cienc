<!doctype html>
<html lang="es">
<head data-titulo="Autores — Informe Cienciométrico"
      data-descripcion="Ranking de autores afiliados con publicaciones, citas y presencia en el top de citación."></head>
<body data-pagina="autores">
<a class="salto-contenido" href="#contenido">Saltar al contenido</a>
<header class="cabecera" id="cabecera"></header>
<div class="vigencia" id="vigencia"></div>
<main id="contenido" class="contenedor">
  <p class="migas"><a href="index.html">Portada</a> › Autores</p>
  <h1>Autores</h1>
  <div id="aviso-autores"></div>
  <section class="filtros">
    <div class="grupo-filtro">
      <label for="buscar-autor">Buscar autor</label>
      <input type="search" id="buscar-autor" placeholder="Escriba un apellido…">
    </div>
    <label class="opcion"><input type="checkbox" id="solo-interpretables" checked>
      <span id="etiqueta-umbral">Mostrar sólo firmas interpretables</span></label>
  </section>
  <p class="resumen-resultados" id="resumen"></p>
  <div class="tabla-envoltura"><table>
    <thead><tr>
      <th>Autor</th><th>ORCID</th><th>Unidad académica</th>
      <th class="num" data-orden="n_publicaciones" tabindex="0" aria-sort="descending">Publicaciones</th>
      <th class="num" data-orden="citas" tabindex="0" aria-sort="none">Citas</th>
      <th class="num" data-orden="citas_por_publicacion" tabindex="0" aria-sort="none">Citas/pub.</th>
      <th class="num" data-orden="publicaciones_top10" tabindex="0" aria-sort="none">Top 10 %</th>
    </tr></thead><tbody id="tabla-cuerpo"></tbody></table></div>
</main>
<footer class="pie" id="pie"></footer>
<script type="module" src="assets/js/paginas.js"></script>
</body>
</html>
