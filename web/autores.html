<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autores — Informe Cienciométrico</title>
<meta name="description" content="Ranking de autores afiliados con publicaciones, citas y presencia en el top de citación.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<script>/* Corre antes de pintar, y las dos cosas que hace tienen que ocurrir antes.
   1. El tema guardado: desde el módulo diferido, la página aparecería un
      instante con el tema equivocado.
   2. La clase `js`: marca que hay JavaScript. Las vistas conmutables se
      contraen a una sola sólo bajo esa clase; sin JS se muestran las dos, que
      es lo correcto —la tabla es la vía equivalente al gráfico, no un extra—. */
(function(){var e=document.documentElement;e.className+=' js';
try{var t=localStorage.getItem('tema');if(t)e.setAttribute('data-tema',t)}catch(x){}})();</script>
</head>
<body data-pagina="autores">
<a class="salto-contenido" href="#contenido">Saltar al contenido</a>
<header class="cabecera" id="cabecera"></header>
<div class="vigencia" id="vigencia"></div>
<main id="contenido" class="contenedor">
  <p class="migas"><a href="index.html">Portada</a> › Autores</p>
  <h1>Autores</h1>
  <div id="aviso-autores"></div>
  <section class="filtros">
    <div class="grupo-filtro">
      <label for="buscar-autor">Buscar autor</label>
      <input type="search" id="buscar-autor" placeholder="Escriba un apellido…">
    </div>
    <label class="opcion"><input type="checkbox" id="solo-interpretables" checked>
      <span id="etiqueta-umbral">Mostrar sólo firmas interpretables</span></label>
  </section>
  <p class="resumen-resultados" id="resumen"></p>
  <div class="tabla-envoltura"><table>
    <thead><tr>
      <th scope="col">Autor</th><th scope="col">ORCID</th><th scope="col">Unidad académica</th>
      <th scope="col" class="num" data-orden="n_publicaciones" tabindex="0" aria-sort="descending">Publicaciones</th>
      <th scope="col" class="num" data-orden="citas" tabindex="0" aria-sort="none">Citas</th>
      <th scope="col" class="num" data-orden="citas_por_publicacion" tabindex="0" aria-sort="none">Citas/pub.</th>
      <th scope="col" class="num" data-orden="publicaciones_top10" tabindex="0" aria-sort="none">Top 10 %</th>
    </tr></thead><tbody id="tabla-cuerpo"></tbody></table></div>
</main>
<footer class="pie" id="pie"></footer>
<script type="module" src="assets/js/paginas.js"></script>
</body>
</html>
