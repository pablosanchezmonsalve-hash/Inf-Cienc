<!doctype html>
<html lang="es">
<head data-titulo="Publicaciones — Informe Bibliométrico"
      data-descripcion="Tabla completa de publicaciones con filtros por año, tipo, área, unidad y acceso abierto."></head>
<body data-pagina="publicaciones">
<a class="salto-contenido" href="#contenido">Saltar al contenido</a>
<header class="cabecera" id="cabecera"></header>
<div class="vigencia" id="vigencia"></div>
<main id="contenido" class="contenedor">
  <!-- Publicaciones usa EL MISMO motor de filtrado que la portada y las
       secciones. Antes tenía el suyo propio: dos implementaciones del mismo
       concepto, con claves distintas para la misma dimensión. Ahora un recorte
       hecho en la portada llega aquí por la URL y sigue valiendo. -->
  <header class="portada-cabecera">
    <div class="portada-id">
      <h1>Publicaciones</h1>
      <p class="portada-sub">El listado completo, con el mismo recorte que el resto del sitio.</p>
    </div>
  </header>

  <div id="estado-recorte"></div>

  <div class="explorador">
    <aside class="explorador-panel" aria-label="Filtros">
      <h2 class="solo-lectores">Filtrar las publicaciones</h2>
      <div id="controles"></div>
    </aside>

    <div class="explorador-resultado">
      <div class="acciones-tabla">
        <span id="estado-seleccion" class="nota" aria-live="polite"></span>
        <button class="boton" id="exportar-seleccion" disabled>Exportar selección</button>
        <button class="boton boton-primario" id="exportar">Exportar CSV (todo el recorte)</button>
      </div>
      <div class="tabla-envoltura"><table>
    <thead><tr>
      <th scope="col" class="col-marca"><label class="solo-lectores" for="marcar-todo">Seleccionar todas las publicaciones de esta página</label>
        <input type="checkbox" id="marcar-todo"></th>
      <th scope="col">Año</th><th scope="col">Título y autores UFT</th><th scope="col">Fuente</th>
      <th scope="col">Tipo</th><th scope="col" class="num">Citas</th><th scope="col" class="num">FWCI</th></tr></thead>
    <tbody id="tabla-cuerpo"></tbody></table></div>
  
      <div class="paginacion" id="paginacion"></div>
    </div>
  </div>
</main>
<footer class="pie" id="pie"></footer>
<script type="module" src="assets/js/paginas.js"></script>
</body>
</html>
