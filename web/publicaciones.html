<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicaciones — Informe Cienciométrico</title>
<meta name="description" content="Tabla completa de publicaciones con filtros por año, tipo, área, unidad y acceso abierto.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<script>/* Corre antes de pintar, y las dos cosas que hace tienen que ocurrir antes.
   1. El tema guardado: desde el módulo diferido, la página aparecería un
      instante con el tema equivocado.
   2. La clase `js`: marca que hay JavaScript. Las vistas conmutables se
      contraen a una sola sólo bajo esa clase; sin JS se muestran las dos, que
      es lo correcto —la tabla es la vía equivalente al gráfico, no un extra—. */
(function(){var e=document.documentElement;e.className+=' js';
try{var t=localStorage.getItem('tema');if(t)e.setAttribute('data-tema',t)}catch(x){}})();</script>
</head>
<body data-pagina="publicaciones">
<a class="salto-contenido" href="#contenido">Saltar al contenido</a>
<header class="cabecera" id="cabecera"></header>
<div class="vigencia" id="vigencia"></div>
<main id="contenido" class="contenedor">
  <p class="migas"><a href="index.html">Portada</a> › Publicaciones</p>
  <header class="encabezado-seccion">
    <h1>Publicaciones</h1>
    <p class="intro">Los filtros combinan con Y entre categorías y con O dentro de
  cada categoría. «Sin dato declarado» es una opción de filtro, no un hueco.</p>
  </header>
  <section class="filtros"><h2>Filtros</h2><div id="filtros"></div></section>
  <div class="chips" id="chips"></div>
  <p class="resumen-resultados" id="resumen"></p>
  <div class="tabla-envoltura"><table>
    <thead><tr><th scope="col">Año</th><th scope="col">Título y autores UFT</th><th scope="col">Fuente</th>
      <th scope="col">Tipo</th><th scope="col" class="num">Citas</th><th scope="col" class="num">FWCI</th></tr></thead>
    <tbody id="tabla-cuerpo"></tbody></table></div>
  <div class="paginacion" id="paginacion"></div>
</main>
<footer class="pie" id="pie"></footer>
<script type="module" src="assets/js/paginas.js"></script>
</body>
</html>
