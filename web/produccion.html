<!doctype html>
<html lang="es">
<head data-titulo="Producción — Informe Bibliométrico"
      data-descripcion="Volumen de publicaciones por año, tipo documental, fuente y unidad académica."></head>
<body data-pagina="seccion">
<a class="salto-contenido" href="#contenido">Saltar al contenido</a>
<header class="cabecera" id="cabecera"></header>
<div class="vigencia" id="vigencia"></div>
<main id="contenido" class="contenedor" data-seccion="produccion">
  <!-- Sección explorable: los mismos filtros que la portada, y los cortes
       propios de este eje recalculados sobre el recorte. El pre-renderizado
       deja escrito el estado sin filtrar, que es el informe completo. -->
  <header class="portada-cabecera">
    <div id="titular"></div>
  </header>

  <div id="estado-recorte"></div>

  <div class="explorador">
    <aside class="explorador-panel" aria-label="Filtros">
      <h2 class="solo-lectores">Filtrar las publicaciones</h2>
      <div id="controles"></div>
    </aside>

    <div class="explorador-resultado">
      <h2 class="solo-lectores">Indicadores del recorte</h2>
      <div id="cifras"></div>

      <h2 class="titulo-seccion">Producción</h2>
      <div class="cortes" id="cortes" data-indicadores="P-02,P-03,P-05,P-07"></div>

      <div id="diferidos"></div>
    </div>
  </div>
</main>
<footer class="pie" id="pie"></footer>
<script type="module" src="assets/js/paginas.js"></script>
</body>
</html>
