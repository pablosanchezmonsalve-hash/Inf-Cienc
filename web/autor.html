<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de autor — Informe Cienciométrico</title>
<meta name="description" content="Ficha pública de autor con indicadores, evolución temporal y listado de publicaciones.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<script>/* Aplica el tema guardado antes de pintar: si se hiciera desde el módulo
   diferido, la página aparecería un instante con el tema equivocado. */
(function(){try{var t=localStorage.getItem('tema');if(t)document.documentElement.setAttribute('data-tema',t)}catch(e){}})();</script>
</head>
<body data-pagina="fichaAutor">
<a class="salto-contenido" href="#contenido">Saltar al contenido</a>
<header class="cabecera" id="cabecera"></header>
<div class="vigencia" id="vigencia"></div>
<main id="contenido" class="contenedor">
  <div id="ficha"></div>
</main>
<footer class="pie" id="pie"></footer>
<script type="module" src="assets/js/paginas.js"></script>
</body>
</html>
