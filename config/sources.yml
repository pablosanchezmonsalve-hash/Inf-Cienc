# config/sources.yml
# Registro de fuentes de datos. Materializa la entidad FuenteDeDatos del modelo
# lógico. Requisito de trazabilidad de CLAUDE.md: todo indicador publicado debe
# poder rastrearse hasta una entrada de este archivo.

fuentes:

  scopus_export:
    nombre: "Scopus — export nativo"
    archivo: "data/raw/export_1667ea7a-7c7a-4b10-ae93-6fca216096cc_2026-07-31T161030.249574865.csv"
    formato: "csv"
    encoding: "utf-8-sig"
    header_row: 0
    rol: "primaria"
    aporta:
      - autoria
      - afiliacion_por_autor
      - abstract
      - referencias
      - financiamiento
    fecha_corte: null            # Sigue sin declararla el export en sí (Ambigüedad
                                  # A-05). No se aplica retroactivamente al CSV
                                  # vigente (docs/UPDATING_REQUEST.md §5) — esto es
                                  # para LA PRÓXIMA carga, que sí debe traerla.
    fecha_export: "2026-07-31"
    ventana_declarada: "2023-2025"
    filtros_aplicados: "ninguno declarado"
    n_registros_declarado: null
    n_registros_leido: 818
    verificacion_api:            # T-06 — NO es la fecha de corte del export: es la
                                  # confirmación, por API, de que el conteo del CSV
                                  # de 2026-07-31 seguía vigente en esta fecha.
                                  # Ver src/enrich/scopus_api.py, data/enriched/scopus_api_consulta.json.
      fecha_consulta: "2026-08-26"
      consulta: "AF-ID(60105368) AND PUBYEAR > 2022 AND PUBYEAR < 2026"
      total_resultados: 818
      coincide_con_n_registros_leido: true

  scival_export:
    nombre: "SciVal — export nativo"
    archivo: "data/raw/Publications_at_Universidad_Finis_Terrae_2023_-_2025.xlsx"
    formato: "xlsx"
    hoja: "Sheet0"
    header_row: 19               # filas 0-18 son metadatos del export
    rol: "primaria"
    aporta:
      - metricas_normalizadas
      - metricas_de_fuente
      - clasificacion_tematica
      - colaboracion
      - scopus_affiliation_ids
      - roles_autorales
    fecha_corte: "2026-07-22"    # "Date last updated" declarado por el export
    fecha_export: "2026-07-31"
    ventana_declarada: "2023 to 2025"
    filtros_aplicados: "not filtered; all publication types"
    n_registros_declarado: 816
    n_registros_leido: 818
    advertencias_del_export:
      - "Some Affiliation names cells are truncated"
      - "Some publication dates might be approximate"

  rdata_scopus:
    nombre: "bibliometrix — Scopus normalizado"
    archivo: "data/raw/Scopus_Normalizado.RData"
    formato: "rdata"
    objeto: "M"
    rol: "referencia"            # NUNCA fuente de indicadores publicables (D-05)
    aporta:
      - afiliaciones_normalizadas_bibliometrix
      - referencias_normalizadas
    proceso_generador: null      # desconocido; no reproducible
    n_registros_leido: 818

  rdata_scival:
    nombre: "bibliometrix — 'SciVal' normalizado"
    archivo: "data/raw/Scival_Normalizado.RData"
    formato: "rdata"
    objeto: "M"
    rol: "referencia"
    nota: >-
      Nombre engañoso: no contiene ninguna métrica de SciVal.
      Es un objeto bibliometrixDB con DB=SCOPUS.
    proceso_generador: null
    n_registros_leido: 818

  rdata_unificado:
    nombre: "bibliometrix — unificado normalizado"
    archivo: "data/raw/Unificado_Normalizado.RData"
    formato: "rdata"
    objeto: "M"
    rol: "referencia"
    nota: >-
      Arrastra 6 columnas residuales de joins repetidos
      (n_references_normalized.x, .y, .x.x, .y.y, .x.x.x, .y.y.y).
    proceso_generador: null
    n_registros_leido: 818

  reporte_excel_2026:
    nombre: "Reporte UFT 2026 — trabajo manual previo"
    archivo: "data/raw/2026_Reporte-UFT.xlsx"
    formato: "xlsx"
    rol: "validacion"            # set de validación, no fuente de verdad (D-15)
    # Cada entrada es una hoja LÓGICA: el código la pide por esta clave y nunca
    # por el nombre literal de la pestaña, que es propio de este libro Excel.
    hojas_utiles:
      investigadores:
        nombre_hoja: "Investigadores"
        columna_autor: "Investigador"
        header_row: 3
        n_registros: 396
      publicaciones_detalle:
        nombre_hoja: "Publicaciones_UFT_detalle"
        header_row: 0
        n_registros: 862
        # Nombre literal de la columna de autor en el archivo de validación.
        # Es propio de este libro Excel, no del sistema: se declara aquí para
        # que no quede escrito en el código (requisito de replicabilidad).
        columna_autor: "Autores finis terrae afiliados"
      publicaciones_unificadas:
        nombre_hoja: "Publicaciones unificadas"
        header_row: 0
        n_registros: 589
    ventana_declarada: "2024-2025"
    # Años que cubre el set de validación manual. La ventana del sistema vive en
    # config/institution.yml; ésta es una propiedad del archivo, y hasta ahora
    # estaba escrita a mano dentro de 04_author_population.py.
    ventana_validacion:
      anio_inicio: 2024
      anio_fin: 2025
    nota: >-
      Contiene fórmulas vivas, no valores materializados, en las columnas de
      conteo. Cobertura temporal menor que las fuentes primarias.

  informe_2024_2025:
    nombre: "Informe 2024-2025"
    archivo: "data/raw/Informe 2024-2025.xlsx"
    formato: "xlsx"
    rol: "documental"
    nota: >-
      Fórmulas rotas: referencian el libro externo [1]!PublicacionesUnicas,
      ausente. Sin valores recuperables. Valor únicamente histórico.

  # ── Fuentes consultadas por API ────────────────────────────────────────────
  #
  # Las de arriba son archivos: se exportan a mano y se versionan. Éstas se
  # preguntan por red, y por eso llevan `endpoint` en vez de `archivo` y no
  # tienen fecha de export: la fecha va en cada dato recuperado.
  #
  # Estaban implementadas y sin declarar aquí, que era una brecha de
  # trazabilidad real: el ORCID se publica en las fichas de autor y hasta ahora
  # no se podía rastrear hasta una entrada de este archivo, que es justo lo que
  # la cabecera exige.

  crossref_api:
    nombre: "Crossref — REST API"
    tipo: "api"
    endpoint: "https://api.crossref.org/works/{doi}"
    autenticacion: "ninguna (mailto para el polite pool)"
    conector: "src/enrich/orcid_crossref.py"
    rol: "enriquecimiento"
    aporta:
      - orcid_declarado_por_el_editor
    salida: "data/enriched/authors_orcid.csv"
    fecha_corte: null            # cada asignación lleva la suya
    nota: >-
      Sólo ve el ORCID que el editor transmitió al depositar. Emparejar por
      apellido e inicial es una hipótesis: cada asignación viaja con su
      confianza y los conflictos se encolan sin resolver (D-08).

  crossref_cobertura_api:
    nombre: "Crossref — REST API (evidencia de cobertura OpenAlex, V2-26 bis)"
    tipo: "api"
    endpoint: "https://api.crossref.org/works/{doi}"
    autenticacion: "ninguna (mailto para el polite pool)"
    conector: "src/enrich/openalex_cobertura_crossref.py"
    rol: "enriquecimiento"
    aporta:
      - afiliacion_declarada_por_la_publicacion_al_depositar
      - tipo_documental_segun_crossref
    salida: "internal/openalex_cobertura_crossref.csv"
    fecha_corte: null            # cada consulta lleva la suya
    nota: >-
      Mismo endpoint que crossref_api, pero otra pregunta: no busca el ORCID
      de un autor, trae la afiliación que la publicación declaró en su
      momento para decidir los 414 casos de internal/openalex_cobertura.csv
      (V2-26). Es evidencia adicional para la revisión humana, no una
      segunda opinión que decida por nadie (D-08) ni un ajuste del corpus
      (D-206). Empareja por apellido contra los autores que Crossref lista;
      no siempre encuentra una coincidencia única.

  crossref_financiamiento_api:
    nombre: "Crossref — REST API (financiamiento declarado, fuente complementaria para X-03)"
    tipo: "api"
    endpoint: "https://api.crossref.org/works/{doi}"
    autenticacion: "ninguna (mailto para el polite pool)"
    conector: "src/enrich/crossref_financiamiento.py"
    rol: "enriquecimiento — la 'fuente complementaria de financiamiento' que config/indicators.yml -> X-03 declara que falta"
    aporta:
      - financiador_y_numero_de_proyecto_segun_crossref
      - contraste_contra_funding_details_de_scopus_sin_fusionar
    salida: "data/enriched/crossref_financiamiento.csv"
    fecha_corte: null            # cada consulta lleva la suya
    ejecutada: false              # implementado y probado con --test el 2026-09-02; api.crossref.org
                                   # devuelve CONNECT tunnel failed / 403 desde este entorno (gateway,
                                   # "policy denial" — ver curl "$HTTPS_PROXY/__agentproxy/status").
                                   # Corrida real pendiente de una máquina con acceso.
    nota: >-
      Tercera pregunta a este mismo endpoint (junto a crossref_api y
      crossref_cobertura_api): qué financiador y número de proyecto declaró
      el EDITOR directamente en Crossref (message.funder, con el
      identificador del Crossref Funder Registry cuando existe) — distinto
      del texto libre que Scopus exporta en Funding Details/Funding Texts
      (306 de 818 filas, 37,4 %, hoy sin extraer a ningún artefacto
      procesado: no llega a publications_universe.csv, verificado). NO
      fusiona el nombre de financiador de una fuente con el de la otra —
      normalizar "CONICYT" y su sucesora "ANID" a la misma entidad es
      trabajo de vocabulario institucional, no de este conector — reporta
      las dos cadenas una al lado de la otra. La cobertura combinada
      resultante es la cifra que decide si X-03 cruza el umbral que hoy lo
      mantiene sin publicar; esa decisión queda pendiente de la corrida
      real.

  orcid_api:
    nombre: "ORCID — Public API v3.0"
    tipo: "api"
    endpoint: "https://pub.orcid.org/v3.0"
    autenticacion: "token client_credentials, alcance /read-public (gratuito)"
    conector: "src/enrich/orcid_api.py, orcid_expand.py, orcid_afiliacion.py"
    rol: "enriquecimiento"
    aporta:
      - verificacion_de_orcid_contra_el_registro_del_titular
      - orcid_declarado_por_el_titular
      - candidatos_por_afiliacion_declarada
    salida: "data/enriched/orcid_verificacion.csv, internal/orcid_*.csv"
    fecha_corte: null
    nota: >-
      Tres preguntas distintas al mismo registro, con tres calidades de
      evidencia distintas. Los candidatos por afiliación NO se publican: no hay
      publicación compartida que los ancle y van a revisión humana.

  ror_api:
    nombre: "ROR — Research Organization Registry"
    tipo: "api"
    endpoint: "https://api.ror.org/v2/organizations"
    autenticacion: "ninguna"
    conector: "src/enrich/ror_institucion.py"
    rol: "referencia"
    aporta:
      - identificador_ror_de_la_institucion
      - isni_de_la_institucion
      - nombres_registrados_para_contrastar_la_deteccion
    salida: "data/enriched/ror_institucion.json"
    fecha_corte: null
    ejecutada: true              # V2-20: consulta corrida el 2026-08-25 (ver data/enriched/ror_institucion.json)
    fecha_ejecucion: "2026-08-25"
    nota: >-
      No aporta ningún dato del corpus ni ningún indicador: aporta identidad de
      la institución y un vocabulario público contra el que contrastar el
      patrón de detección institucional. El contrato de la API no está
      verificado desde este repositorio.

  scopus_api:
    nombre: "Scopus — Search API (Elsevier)"
    tipo: "api"
    endpoint: "https://api.elsevier.com/content/search/scopus"
    autenticacion: "API Key (X-ELS-APIKey); Insttoken opcional según suscripción"
    conector: "src/enrich/scopus_api.py"
    rol: "verificación de corte para T-06"
    aporta:
      - fecha_y_consulta_exacta_de_una_reexportacion
      - contraste_del_recuento_frente_al_universo_declarado
    salida: "data/enriched/scopus_api_consulta.json"
    fecha_corte: null
    ejecutada: true              # T-06: conector probado de punta a punta el 2026-08-26 (ver data/enriched/scopus_api_consulta.json; el resultado también figura en `verificacion_api` de scopus_export).
    fecha_ejecucion: "2026-08-26"
    nota: >-
      NO reemplaza scopus_export ni el universo publicado (823, D-16): la
      Scopus Search API no declara una fecha "actualizado al" propia, así que
      lo que este conector aporta es el instante exacto de ejecución y la
      cadena de consulta literal, no una fecha de corte que la fuente
      declare. Si el recuento difiere del universo vigente, se reporta como
      hallazgo, nunca se aplica automáticamente. Promover un nuevo export a
      fuente primaria es una decisión aparte y posterior.

  openalex_api:
    nombre: "OpenAlex — Works API"
    tipo: "api"
    endpoint: "https://api.openalex.org/works/{doi}"
    autenticacion: "ninguna (mailto para el polite pool)"
    conector: "src/enrich/orcid_openalex.py, openalex_cobertura.py"
    rol: "enriquecimiento y contraste"
    aporta:
      - orcid_donde_no_habia
      - contraste_de_la_deteccion_institucional_por_ror
      - brecha_de_cobertura_frente_al_universo
    salida: "data/enriched/authors_orcid.csv, internal/openalex_*.csv"
    fecha_corte: null
    ejecutada: true              # V2-19/V2-26: connectors corridos el 2026-08-26 (ver internal/openalex_*.csv y las +80 asignaciones nuevas). Contraresta la nota: no es una segunda fuente independiente de ORCID.
    fecha_ejecucion: "2026-08-26"
    nota: >-
      NO es una segunda fuente independiente de ORCID: OpenAlex ingiere
      Crossref, de modo que coincidir con él no confirma nada que no
      supiéramos. Sus concordancias se cuentan aparte y NUNCA suben una
      asignación a 'verificado'. El contrato de la API no está verificado desde
      este repositorio.

  dspace_repositorio:
    nombre: "Repositorio institucional UFT (DSpace) — export de metadatos"
    tipo: "archivo"
    archivo: "data/raw/Inventario_Repositorio_Institucional_UFT.csv"
    formato: "csv"
    encoding: "utf-8"                # reescrito desde cp1252 al limpiarlo, ver nota
    separador: ";"
    conector: "src/enrich/dspace_inventario.py"
    rol: "verificación y candidatos de ORCID, independiente de Scopus/SciVal/Crossref/OpenAlex"
    aporta:
      - contraste_de_orcid_ya_asignado_contra_una_obra_propia
      - candidatos_de_orcid_por_nombre_para_firmas_sin_ninguno
    salida: "data/interim/dspace_verificacion.csv, internal/dspace_candidatos.csv"
    fecha_export: "2026-09-01"       # fecha en que el usuario entregó el archivo
    n_registros_leido: 3271
    n_columnas: 154                  # 157 del export nativo de DSpace, menos 3
    entregado_por: "responsable del proyecto (sesión 2026-09-01)"
    nota: >-
      No sale a red: es un archivo entregado por el responsable del proyecto,
      no una API consultada desde aquí. Cataloga tesis de pregrado/posgrado y
      artículos/libros/capítulos autoarchivados; `dc.contributor.author` trae
      sólo a quien depositó el ítem, y `dc.identifier.orcid` puede traer varios
      ORCID separados por '||' sin decir cuál es de cuál cuando hay más de un
      coautor. El conector distingue evidencia DIRECTA (el nombre depositante
      es la misma firma) de INDIRECTA (el ORCID aparece en la obra, pero
      depositada por otro coautor) — nunca sube una asignación a 'verificado'
      por sí sola: alimenta la cola de revisión humana (D-08), igual que
      Crossref y el registro de ORCID.

      GOBERNANZA DE DATOS: el export nativo de DSpace traía tres columnas
      `dc.description.provenance[*]` con el log de flujo de trabajo del
      repositorio — quién subió y quién aprobó cada ítem, con su correo
      @uft.cl, presente en el 78 % de las filas. Ese es metadato operativo del
      sistema, no dato bibliométrico, y este repositorio es PÚBLICO: se quitó
      antes de que el archivo tocara `data/raw/`. El original sin limpiar no
      se conserva versionado en ningún lugar de este proyecto.

  autoarchivo_biblioteca:
    nombre: "Inventario de autoarchivo — hoja curada por biblioteca UFT"
    tipo: "archivo"
    archivo: "data/raw/Inventario_Repositorio_Autoarchivo.xlsx"
    formato: "xlsx"
    hoja: "AUTOARCHIVOS"
    conector: "src/enrich/autoarchivo_uft.py, src/enrich/autoarchivo_produccion.py"
    rol: "verificación y candidatos de ORCID; candidatos EN BRUTO de Facultad/Escuela; corpus paralelo declarado (PD-03) para las relaciones YA validadas"
    aporta:
      - contraste_de_orcid_ya_asignado_contra_una_obra_propia
      - candidatos_de_orcid_por_nombre_para_firmas_sin_ninguno
      - candidatos_de_facultad_o_escuela_para_no_determinada_sin_traducir_al_vocabulario
      - produccion_declarada_por_unidad_fuera_del_corpus_scopus_pd_03
    salida: >-
      data/interim/autoarchivo_verificacion.csv,
      internal/autoarchivo_candidatos.csv,
      internal/autoarchivo_unidad_candidatos.csv,
      data/enriched/autoarchivo_produccion.json
    fecha_export: "2026-09-01"       # fecha en que el usuario entregó el archivo
    n_registros_leido: 808
    entregado_por: "responsable del proyecto (sesión 2026-09-01)"
    nota: >-
      No sale a red. DISTINTA de `dspace_repositorio`: aquélla es el volcado
      de metadatos del sistema DSpace, ésta es una hoja que el equipo de
      biblioteca mantiene a mano al autoarchivar cada obra (2004-2026, más
      amplia que la ventana 2023-2025 del corpus canónico). Trae, además de
      ORCID, la Facultad o Escuela que biblioteca le asignó a cada obra — un
      dato que `dspace_repositorio` no tiene. Ese campo se declara EN BRUTO
      («Medicina», «CIDOC», etc., sin traducir a `config/matching_rules.yml`):
      traducirlo a la jerarquía oficial es el mismo trabajo institucional que
      exigió `T-02`. `autoarchivo_produccion.py` (2026-09-02) SÍ lo traduce,
      pero SÓLO para las relaciones que ya están validadas (jerarquía
      confirmada, vocabulario I-07, o las dos entradas de
      `REFERENCIA_UNIDADES_AUTOARCHIVO` que el usuario confirmó contra
      finis.cl) — el resto de las ~35 cadenas EN BRUTO se publica por
      unidad declarada, nunca forzado a una Facultad sin validar. Las dos
      fuentes pueden confirmarse o contradecirse entre sí (`Arroyo A.`
      aparece contradicho en ambas, con el mismo ORCID alternativo en las
      dos — evidencia cruzada, no una casualidad).

  facultad_medicina_publicaciones:
    nombre: "Facultad de Medicina y Salud UFT — listado propio de publicaciones (API REST de WordPress)"
    tipo: "api"
    endpoint: "https://facultadmedicina.finis.cl/wp-json/wp/v2/pages?slug=publicaciones&_fields=id,title,link,content"
    autenticacion: "ninguna"
    conector: "src/enrich/facultad_medicina_publicaciones.py"
    rol: "corpus paralelo declarado por la institución, no verificado por Scopus (D-206, D-398)"
    # La bandera que 09_produccion_declarada.py usa para DESCUBRIR fuentes de
    # este tipo sin nombrar "Medicina" en el código: una segunda Facultad que
    # sume su propio listado más adelante sólo necesita esta misma bandera en
    # su propia entrada, y su propio conector siguiendo el mismo esquema (ver
    # el docstring de facultad_medicina_publicaciones.py) — nada en
    # src/build/ cambia.
    corpus_paralelo_declarado: true
    aporta:
      - produccion_declarada_por_la_facultad_fuera_del_corpus_scopus
    salida: "data/enriched/facultad_medicina_publicaciones.json, internal/facultad_medicina_cruce.csv"
    # El único de los dos que 09_produccion_declarada.py lee.
    salida_declarada: "data/enriched/facultad_medicina_publicaciones.json"
    fecha_corte: null              # cada descarga lleva su propia fecha, no una fecha de corte fija
    fecha_ejecucion: "2026-09-01"  # última corrida real (Cierre · V2-27, SESSION_NOTES.md)
    n_registros_leido: 609
    nota: >-
      La Facultad publica su propia lista de producción (Medicina por año,
      Enfermería, Nutrición y Dietética, y Libros) en su sitio, con criterio
      editorial propio: no es un índice bibliográfico y no aplica los mismos
      criterios de cobertura que Scopus. El conector cruza por DOI contra
      publications_universe.csv sólo para separar lo que ya está en el
      corpus indexado de lo que declara por fuera de él; NUNCA escribe en
      publications_universe.csv ni en ningún artefacto que mezcle ambos
      conteos. Publica sólo RECUENTOS por facultad × año (PD-01) — nunca
      citas ni FWCI, porque SciVal sólo mide lo indexado en Scopus. La
      fuente NO deduplica (609 registros crudos, DOIs repetidos): "el sitio
      lista duplicados; borrarlos en el extractor ocultaría un dato de la
      fuente y forzaría una decisión que no le toca a la ingesta" — la
      deduplicación por DOI ocurre en el consumidor,
      `src/build/09_produccion_declarada.py`.

  scopus_author_search:
    nombre: "Scopus Author Search — directorio de autores por afiliación institucional"
    tipo: "archivo"
    archivo: "data/raw/Scopus_Author_Search_UFT.csv"
    formato: "csv"
    encoding: "utf-8-sig"
    conector: "src/enrich/scopus_author_search.py"
    rol: "verificación y candidatos de identidad — capa interna, nunca decide (D-08)"
    aporta:
      - candidatos_de_nombre_con_multiples_scopus_author_id
      - contraste_de_orcid_declarado_directamente_por_scopus
    salida: >-
      internal/scopus_author_search_multiples_id.csv,
      internal/scopus_author_search_orcid.csv
    fecha_corte: null                # no aplica: es un directorio de autores, no un export de producción
    fecha_entrega: "2026-09-02"      # fecha en que el usuario entregó el archivo
    n_registros_leido: 812
    entregado_por: "responsable del proyecto (sesión 2026-09-02)"
    nota: >-
      DISTINTO de `scopus_export`: aquél es el export nativo de
      publicaciones (823 filas, ventana 2023-2025 declarada); éste es el
      directorio de AUTORES que Scopus Author Search asocia a la
      afiliación "Universidad Finis Terrae", sin ventana temporal —
      confirmado con el usuario: "búsqueda por afiliación", sin filtro de
      año. El "Number of Documents" de cada perfil es el que ve Scopus
      Author Search (alcance completo del perfil), NO el número de
      publicaciones de ese autor dentro del corpus de este proyecto — los
      dos nunca se mezclan sin decirlo.

      Verificado antes de construir el conector: el detector automático de
      "un nombre con más de un Scopus Author ID" (`P-04`,
      `src/audit/04_author_population.py`) sólo ve fragmentación cuando
      ambos identificadores aparecen, DENTRO del corpus de 823
      publicaciones, bajo la misma cadena de nombre exacta — no puede ver
      un identificador cuyas publicaciones caen fuera del corpus ni
      conectar dos identificadores bajo grafías distintas del mismo
      nombre. Esta fuente sí los ve, porque Scopus ya agrupó por
      identificador antes de exportar (3 casos nuevos encontrados así, no
      detectables antes: "Esis Villarroel, Ivette S." — un segundo perfil
      con 14 documentos invisible al detector; "Cabello, José Miguel";
      "Caffarena, Paula" — con un identificador que en el corpus aparece
      bajo "Barcenilla, Paula Caffarena", apellidos en otro orden).
