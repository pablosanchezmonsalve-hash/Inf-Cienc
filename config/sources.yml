# config/sources.yml
# Registro de fuentes de datos. Materializa la entidad FuenteDeDatos del modelo
# lógico. Requisito de trazabilidad de CLAUDE.md: todo indicador publicado debe
# poder rastrearse hasta una entrada de este archivo.

fuentes:

  scopus_export:
    nombre: "Scopus — export nativo"
    archivo: "data/raw/export_1667ea7a-7c7a-4b10-ae93-6fca216096cc_2026-07-31T161030.249574865.csv"
    formato: "csv"
    encoding: "utf-8-sig"
    header_row: 0
    rol: "primaria"
    aporta:
      - autoria
      - afiliacion_por_autor
      - abstract
      - referencias
      - financiamiento
    fecha_corte: null            # Sigue sin declararla el export en sí (Ambigüedad
                                  # A-05). No se aplica retroactivamente al CSV
                                  # vigente (docs/UPDATING_REQUEST.md §5) — esto es
                                  # para LA PRÓXIMA carga, que sí debe traerla.
    fecha_export: "2026-07-31"
    ventana_declarada: "2023-2025"
    filtros_aplicados: "ninguno declarado"
    n_registros_declarado: null
    n_registros_leido: 818
    verificacion_api:            # T-06 — NO es la fecha de corte del export: es la
                                  # confirmación, por API, de que el conteo del CSV
                                  # de 2026-07-31 seguía vigente en esta fecha.
                                  # Ver src/enrich/scopus_api.py, data/enriched/scopus_api_consulta.json.
      fecha_consulta: "2026-08-26"
      consulta: "AF-ID(60105368) AND PUBYEAR > 2022 AND PUBYEAR < 2026"
      total_resultados: 818
      coincide_con_n_registros_leido: true

  scival_export:
    nombre: "SciVal — export nativo"
    archivo: "data/raw/Publications_at_Universidad_Finis_Terrae_2023_-_2025.xlsx"
    formato: "xlsx"
    hoja: "Sheet0"
    header_row: 19               # filas 0-18 son metadatos del export
    rol: "primaria"
    aporta:
      - metricas_normalizadas
      - metricas_de_fuente
      - clasificacion_tematica
      - colaboracion
      - scopus_affiliation_ids
      - roles_autorales
    fecha_corte: "2026-07-22"    # "Date last updated" declarado por el export
    fecha_export: "2026-07-31"
    ventana_declarada: "2023 to 2025"
    filtros_aplicados: "not filtered; all publication types"
    n_registros_declarado: 816
    n_registros_leido: 818
    advertencias_del_export:
      - "Some Affiliation names cells are truncated"
      - "Some publication dates might be approximate"

  rdata_scopus:
    nombre: "bibliometrix — Scopus normalizado"
    archivo: "data/raw/Scopus_Normalizado.RData"
    formato: "rdata"
    objeto: "M"
    rol: "referencia"            # NUNCA fuente de indicadores publicables (D-05)
    aporta:
      - afiliaciones_normalizadas_bibliometrix
      - referencias_normalizadas
    proceso_generador: null      # desconocido; no reproducible
    n_registros_leido: 818

  rdata_scival:
    nombre: "bibliometrix — 'SciVal' normalizado"
    archivo: "data/raw/Scival_Normalizado.RData"
    formato: "rdata"
    objeto: "M"
    rol: "referencia"
    nota: >-
      Nombre engañoso: no contiene ninguna métrica de SciVal.
      Es un objeto bibliometrixDB con DB=SCOPUS.
    proceso_generador: null
    n_registros_leido: 818

  rdata_unificado:
    nombre: "bibliometrix — unificado normalizado"
    archivo: "data/raw/Unificado_Normalizado.RData"
    formato: "rdata"
    objeto: "M"
    rol: "referencia"
    nota: >-
      Arrastra 6 columnas residuales de joins repetidos
      (n_references_normalized.x, .y, .x.x, .y.y, .x.x.x, .y.y.y).
    proceso_generador: null
    n_registros_leido: 818

  reporte_excel_2026:
    nombre: "Reporte UFT 2026 — trabajo manual previo"
    archivo: "data/raw/2026_Reporte-UFT.xlsx"
    formato: "xlsx"
    rol: "validacion"            # set de validación, no fuente de verdad (D-15)
    # Cada entrada es una hoja LÓGICA: el código la pide por esta clave y nunca
    # por el nombre literal de la pestaña, que es propio de este libro Excel.
    hojas_utiles:
      investigadores:
        nombre_hoja: "Investigadores"
        columna_autor: "Investigador"
        header_row: 3
        n_registros: 396
      publicaciones_detalle:
        nombre_hoja: "Publicaciones_UFT_detalle"
        header_row: 0
        n_registros: 862
        # Nombre literal de la columna de autor en el archivo de validación.
        # Es propio de este libro Excel, no del sistema: se declara aquí para
        # que no quede escrito en el código (requisito de replicabilidad).
        columna_autor: "Autores finis terrae afiliados"
      publicaciones_unificadas:
        nombre_hoja: "Publicaciones unificadas"
        header_row: 0
        n_registros: 589
    ventana_declarada: "2024-2025"
    # Años que cubre el set de validación manual. La ventana del sistema vive en
    # config/institution.yml; ésta es una propiedad del archivo, y hasta ahora
    # estaba escrita a mano dentro de 04_author_population.py.
    ventana_validacion:
      anio_inicio: 2024
      anio_fin: 2025
    nota: >-
      Contiene fórmulas vivas, no valores materializados, en las columnas de
      conteo. Cobertura temporal menor que las fuentes primarias.

  informe_2024_2025:
    nombre: "Informe 2024-2025"
    archivo: "data/raw/Informe 2024-2025.xlsx"
    formato: "xlsx"
    rol: "documental"
    nota: >-
      Fórmulas rotas: referencian el libro externo [1]!PublicacionesUnicas,
      ausente. Sin valores recuperables. Valor únicamente histórico.

  # ── Fuentes consultadas por API ────────────────────────────────────────────
  #
  # Las de arriba son archivos: se exportan a mano y se versionan. Éstas se
  # preguntan por red, y por eso llevan `endpoint` en vez de `archivo` y no
  # tienen fecha de export: la fecha va en cada dato recuperado.
  #
  # Estaban implementadas y sin declarar aquí, que era una brecha de
  # trazabilidad real: el ORCID se publica en las fichas de autor y hasta ahora
  # no se podía rastrear hasta una entrada de este archivo, que es justo lo que
  # la cabecera exige.

  crossref_api:
    nombre: "Crossref — REST API"
    tipo: "api"
    endpoint: "https://api.crossref.org/works/{doi}"
    autenticacion: "ninguna (mailto para el polite pool)"
    conector: "src/enrich/orcid_crossref.py"
    rol: "enriquecimiento"
    aporta:
      - orcid_declarado_por_el_editor
    salida: "data/enriched/authors_orcid.csv"
    fecha_corte: null            # cada asignación lleva la suya
    nota: >-
      Sólo ve el ORCID que el editor transmitió al depositar. Emparejar por
      apellido e inicial es una hipótesis: cada asignación viaja con su
      confianza y los conflictos se encolan sin resolver (D-08).

  orcid_api:
    nombre: "ORCID — Public API v3.0"
    tipo: "api"
    endpoint: "https://pub.orcid.org/v3.0"
    autenticacion: "token client_credentials, alcance /read-public (gratuito)"
    conector: "src/enrich/orcid_api.py, orcid_expand.py, orcid_afiliacion.py"
    rol: "enriquecimiento"
    aporta:
      - verificacion_de_orcid_contra_el_registro_del_titular
      - orcid_declarado_por_el_titular
      - candidatos_por_afiliacion_declarada
    salida: "data/enriched/orcid_verificacion.csv, internal/orcid_*.csv"
    fecha_corte: null
    nota: >-
      Tres preguntas distintas al mismo registro, con tres calidades de
      evidencia distintas. Los candidatos por afiliación NO se publican: no hay
      publicación compartida que los ancle y van a revisión humana.

  ror_api:
    nombre: "ROR — Research Organization Registry"
    tipo: "api"
    endpoint: "https://api.ror.org/v2/organizations"
    autenticacion: "ninguna"
    conector: "src/enrich/ror_institucion.py"
    rol: "referencia"
    aporta:
      - identificador_ror_de_la_institucion
      - isni_de_la_institucion
      - nombres_registrados_para_contrastar_la_deteccion
    salida: "data/enriched/ror_institucion.json"
    fecha_corte: null
    ejecutada: false             # V2-20: el conector existe, la consulta no se ha corrido
    nota: >-
      No aporta ningún dato del corpus ni ningún indicador: aporta identidad de
      la institución y un vocabulario público contra el que contrastar el
      patrón de detección institucional. El contrato de la API no está
      verificado desde este repositorio.

  scopus_api:
    nombre: "Scopus — Search API (Elsevier)"
    tipo: "api"
    endpoint: "https://api.elsevier.com/content/search/scopus"
    autenticacion: "API Key (X-ELS-APIKey); Insttoken opcional según suscripción"
    conector: "src/enrich/scopus_api.py"
    rol: "verificación de corte para T-06"
    aporta:
      - fecha_y_consulta_exacta_de_una_reexportacion
      - contraste_del_recuento_frente_al_universo_declarado
    salida: "data/enriched/scopus_api_consulta.json"
    fecha_corte: null
    ejecutada: false             # el conector existe, la consulta no se ha corrido
    nota: >-
      NO reemplaza scopus_export ni el universo publicado (823, D-16): la
      Scopus Search API no declara una fecha "actualizado al" propia, así que
      lo que este conector aporta es el instante exacto de ejecución y la
      cadena de consulta literal, no una fecha de corte que la fuente
      declare. Si el recuento difiere del universo vigente, se reporta como
      hallazgo, nunca se aplica automáticamente. Promover un nuevo export a
      fuente primaria es una decisión aparte y posterior.

  openalex_api:
    nombre: "OpenAlex — Works API"
    tipo: "api"
    endpoint: "https://api.openalex.org/works/{doi}"
    autenticacion: "ninguna (mailto para el polite pool)"
    conector: "src/enrich/orcid_openalex.py, openalex_cobertura.py"
    rol: "enriquecimiento y contraste"
    aporta:
      - orcid_donde_no_habia
      - contraste_de_la_deteccion_institucional_por_ror
      - brecha_de_cobertura_frente_al_universo
    salida: "data/enriched/authors_orcid.csv, internal/openalex_*.csv"
    fecha_corte: null
    ejecutada: false             # V2-19: el conector existe, la consulta no se ha corrido
    nota: >-
      NO es una segunda fuente independiente de ORCID: OpenAlex ingiere
      Crossref, de modo que coincidir con él no confirma nada que no
      supiéramos. Sus concordancias se cuentan aparte y NUNCA suben una
      asignación a 'verificado'. El contrato de la API no está verificado desde
      este repositorio.
