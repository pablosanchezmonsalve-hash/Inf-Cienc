# config/matching_rules.yml
# Reglas de detección institucional, normalización de nombres y vocabulario de
# unidades académicas.
#
# REPLICABILIDAD: junto a institution.yml, este archivo concentra todo lo que
# otra institución debe adaptar. La lógica de src/ lee de aquí y no contiene
# patrones institucionales escritos a mano.
#
# CAPA: interna. Las reglas de matching no se publican por defecto
# (CLAUDE.md, <data_governance>).

deteccion_institucional:

  # Método duro (regla I-02). Confianza alta.
  # Compara contra institucion.scopus_affiliation_id.
  metodo_duro:
    activo: true
    campo: "Scopus Affiliation IDs"
    fuente: "scival_export"
    confianza: "alta"

  # Método blando (regla I-03). Confianza media.
  # Se aplica sobre las cadenas de afiliación del export de Scopus, que es la
  # única fuente que permite saber QUÉ AUTOR está afiliado a la institución.
  metodo_blando:
    activo: true
    campo: "Authors with affiliations"
    fuente: "scopus_export"
    confianza: "media"
    # Patrón con límite de palabra, insensible a caso y a acentos.
    # El separador admite espacio o guion: la variante "Universidad Finis-Terrae"
    # existe en los datos y con '\s+' se perdía (falso negativo verificado).
    patrones:
      - '\bfinis[\s\-]+terrae\b'
    # Regla I-05: prohibido el matching por subcadena suelta.
    # Verificado empíricamente en Fase 1: la subcadena 'inis' produce 16 cadenas
    # de falso positivo ("Ministerio de Salud", "Faculty of Business
    # Administration", "Medizinische ...", "Department of Medicine and
    # Geriatrics"). El patrón con límite de palabra no las captura.
    patrones_prohibidos:
      - 'inis'
      - 'finis'      # sin límite de palabra ni exigencia de 'terrae'
    normalizar_acentos: true
    normalizar_caso: true

  # Regla I-04: los dos métodos deben reconciliarse. Toda discrepancia se
  # registra en internal/ y se revisa; no se resuelve en silencio.
  reconciliacion_obligatoria: true

unidad_academica:
  # Regla I-06. Extracción por patrón sobre la cadena de afiliación
  # institucional.
  activo: true
  patrones_extraccion:
    - '(Facultad de [^,]+)'
    - '(Faculty of [^,]+)'
    - '(Escuela de [^,]+)'
    - '(School of [^,]+)'

  # La extracción se restringe a la ventana de texto que precede a la mención
  # de la institución foco y se detiene ante cualquier marcador de OTRA
  # institución. Sin esta restricción, un autor con doble afiliación recibía la
  # facultad de la otra universidad: caso verificado en Fase 1, donde
  # "Faculty of Medicine and Nursing" (Universidad del País Vasco) se atribuía
  # a 30 pares autor x publicación de la UFT.
  restringir_a_ventana_institucional: true
  marcadores_otra_institucion:
    - 'Universit'
    - 'Universidad'
    - 'Hospital'
    - 'Institut'
    - 'Clinic'
    - 'Clínic'
    - 'College'
    - 'Centro Asistencial'

  # El designador que precede al nombre de la institución foco ("Universidad"
  # en "Universidad Finis Terrae") queda como token colgante al cortar la cadena
  # en la posición del match. No es un marcador de OTRA institución: se descarta
  # antes de recorrer la ventana, o la extracción se corta siempre en el primer
  # paso y la cobertura cae a cero.
  designadores_institucionales:
    - 'Universidad'
    - 'University'
    - 'Univ'
    - 'Univ.'
    - 'la Universidad'
    - 'de la Universidad'

  # Restos de la cadena institucional que quedan pegados a la unidad cuando la
  # fuente omite la coma separadora.
  sufijos_a_limpiar:
    - 'Universidad Finis Terrae'
    - 'Univ. Finis Terrae'
    - 'de la Universidad Finis Terrae'
    - 'en la Univ. Finis Terrae'
  # El ~30 % restante NO se imputa (decisión D-09).
  etiqueta_sin_dato: "No determinada"

  # Correcciones declaradas de artefactos del ORIGEN.
  #
  # No son reglas: son hechos sobre ESTE conjunto de datos. Scopus entregó estas
  # cadenas con dos nombres pegados sin separador, y el extractor las toma tal
  # cual porque son lo que dice la afiliación. Cada entrada corrige un caso
  # observado y se justifica; deducir una regla general de tres casos —por
  # ejemplo «cortar donde una minúscula precede a una mayúscula»— rompería
  # nombres legítimos.
  #
  # La clave se compara normalizada (sin acentos, sin distinguir mayúsculas).
  # Si la afiliación se reexporta corregida, estas entradas dejan de aplicarse
  # solas y pueden retirarse.
  #
  # Aparte de esto, `reparar_texto_fuente()` arregla un problema distinto y
  # genérico: 'Ingenierı́a' escrito con i sin punto más acento combinante, que
  # es la misma palabra pero otra cadena. Eso sí es una regla, no una tabla.
  correcciones_declaradas:
    # 1 par. Afiliación: "Facultad de MedicinaEscuela de Medicina, Universidad
    # Finis Terrae". Dos niveles pegados; se conserva la facultad, que es el
    # nivel que el indicador P-07 agrega.
    "Facultad de MedicinaEscuela de Medicina": "Facultad de Medicina"
    # 1 par. Afiliación: "Facultad de EducaciónPsicología y Familia". El nombre
    # completo de la unidad es "Facultad de Educación, Psicología y Familia":
    # falta la coma, no sobra texto.
    "Facultad de EducaciónPsicología y Familia": "Facultad de Educación, Psicología y Familia"
    # 1 par. Afiliación: "Department of Cardiovascular DiseasesFaculty of
    # MedicineUniver-sidad Finis Terrae-Clínica Las Condes". Tres fragmentos
    # pegados y un guion de corte de línea dentro de "Universidad".
    "Faculty of MedicineUniver-sidad": "Facultad de Medicina"
    # 1 par. Distinto de los tres anteriores: no es un artefacto de
    # concatenación, es doble afiliación real mal resuelta. Afiliación
    # completa: "Universidad San Sebastián, Facultad de Odontología y
    # Ciencias de la Rehabilitación, Carrera de Fonoaudiología, Santiago,
    # Chile, Universidad Finis Terrae, Facultad de Educación, Psicología y
    # Familia, Santiago, Chile" (Allende-Valenzuela T., Scopus Author ID
    # 59321456000, ORCID 0009-0009-2334-0562, eid 2-s2.0-85203525781). El
    # extractor tomó la facultad de la OTRA universidad (USS) en vez de la de
    # la UFT, que viene después en la misma cadena. Confirmado por el
    # responsable del proyecto (T-02, 2026-08-26) tras verificar que la
    # autora está afiliada a la institución: es la misma persona con
    # nombramiento en ambas universidades, y la unidad UFT es Educación,
    # Psicología y Familia, no Odontología.
    "Facultad de Odontología y Ciencias de la Rehabilitación": "Facultad de Educación, Psicología y Familia"

  # Jerarquía escuela -> facultad.
  # Permite agregar la producción a nivel de facultad sin perder el detalle de
  # escuela. Una escuela sin entrada aquí se reporta por sí misma.
  #
  # ESTATUS DE CADA RELACIÓN:
  #   confirmada  -> validada por el responsable del proyecto
  #   inferida    -> deducida de los datos, PENDIENTE de validación
  jerarquia:
    "Escuela de Kinesiología":
      facultad: "Facultad de Medicina y Salud"
      estado: confirmada        # corregido por revisión humana, 2026-08-26
    "Escuela de Nutrición y Dietética":
      facultad: "Facultad de Medicina y Salud"
      estado: confirmada        # corregido por revisión humana, 2026-08-26
    "Escuela de Enfermería":
      facultad: "Facultad de Medicina y Salud"
      estado: confirmada        # corregido por revisión humana, 2026-08-26
    "Escuela de Ciencias de la Familia":
      facultad: "Facultad de Educación y Ciencias Sociales"
      estado: confirmada        # corregido por revisión humana, 2026-08-26
    "Escuela de Ingeniería Civil Industrial":
      facultad: "Facultad de Ingeniería"
      estado: confirmada        # confirmado por revisión humana, 2026-08-26 —
                                 # entrada nueva (T-02), sin fila en el CSV por
                                 # no existir como "inferida" al generar la hoja

  # Vocabulario controlado (regla I-07).
  # ESTATUS: INFERIDO DE LOS DATOS, NO OFICIAL.
  # No existe catálogo oficial UFT disponible para este proyecto. Los nombres se
  # dedujeron de cómo aparecen escritos en las afiliaciones y requieren
  # validación institucional antes de publicar comparaciones entre unidades.
  vocabulario_validado_por_institucion: true    # confirmado por revisión humana, 2026-08-26
  vocabulario:
    "Escuela de Ingeniería Civil Industrial":
      - "Escuela de Ingeniería Civil Industrial"
      - "School of Industrial Engineering"
    "Facultad de Medicina y Salud":
      - "Facultad de Medicina"
      - "Faculty of Medicine"
      - "Escuela de Medicina"
      - "School of Medicine"
      - "School of Medicine UFT-CLC"
      - "Facultad de Odontología"
      - "Faculty of Dentistry"
      - "Escuela de Odontología"
      - "School of Dentistry"
    "Escuela de Kinesiología":
      - "Escuela de Kinesiología"
      - "School of Kinesiology"
    "Escuela de Nutrición y Dietética":
      - "Escuela de Nutrición y Dietética"
      - "School of Nutrition and Dietetics"
    "Facultad de Ingeniería":
      - "Facultad de Ingeniería"
      - "Faculty of Engineering"
      - "School of Civil Engineering"
      - "School of Engineering"
    "Facultad de Educación y Ciencias Sociales":
      - "Facultad de Educación"
      - "Faculty of Education"
      - "Facultad de Educación Psicología y Familia"
      - "Facultad de Educación, Psicología y Familia"
      - "Escuela de Psicología"
      - "School of Psychology"
    "Facultad de Economía y Negocios":
      - "Facultad de Economía y Negocios"
      - "Faculty of Economics and Business"
      - "School of Economics and Business"
      - "Facultad de Economía y Negocios en la Univ"
    "Facultad de Derecho":
      - "Facultad de Derecho"
      - "Faculty of Law"
      - "Escuela de Derecho"
      - "School of Law"
    "Facultad de Artes":
      - "Facultad de Artes"
      - "Faculty of Arts"
      - "Facultad de Artes Visuales"
      - "Escuela de Artes Visuales"
      - "School of Arts"
    "Facultad de Arquitectura, Diseño y Estudios Creativos":
      - "Facultad de Arquitectura y Diseño"
      - "Faculty of Architecture and Design"
      - "Faculty of Archi-tecture and Design"
      - "Escuela de Arquitectura"
      - "School of Architecture"
    "Facultad de Humanidades y Comunicaciones":
      - "Facultad de Comunicaciones y Humanidades"
      - "Facultad de Humanidades y Comunicaciones"
      - "Faculty of Communications and Humanities"
      - "Escuela de Historia"
      - "School of History"
    "Escuela de Enfermería":
      - "Escuela de Enfermería"
      - "School of Nursing"
    "Escuela de Ciencias de la Familia":
      - "Escuela de Ciencias de la Familia"
      - "School of Family Sciences"

identidad_autor:
  # Clave de identidad disponible. ORCID no existe en las fuentes actuales.
  clave_primaria: "scopus_author_id"

  # Normalización de nombre para DETECTAR variantes. Nunca para fusionarlas
  # automáticamente (restricción de PROMPT_FASE_1 y CLAUDE.md).
  normalizacion_nombre:
    minusculas: true
    quitar_acentos: true
    quitar_puntuacion: true
    quitar_guiones: true

  # Reglas P-03, P-04, P-05: se marcan como ambigüedad, no se resuelven.
  colapso_automatico_de_variantes: false

  ambiguedades_a_registrar:
    - apellido_base_con_multiples_formas       # P-03
    - nombre_completo_con_multiples_scopus_id  # P-04
    - scopus_id_con_multiples_nombres          # P-05

enriquecimiento_externo:
  # Confirmado por el usuario (sesión 2026-07-31): ORCID puede recuperarse desde
  # el repositorio institucional UFT, Crossref y otras fuentes.
  # NO se ejecuta en Fase 1. Registrado como pendiente accionable para Fase 2/3.
  orcid:
    disponible_en_fuentes_actuales: false
    estrategia_propuesta: "Crossref REST API por DOI (cobertura DOI: 97,7 %)"
    fuentes_candidatas:
      - "Crossref"
      - "Repositorio institucional UFT"
      - "ORCID Public API"
    # Implementado en src/enrich/orcid_crossref.py, y EJECUTADO: las 174
    # asignaciones con fuente 'Crossref' de data/enriched/authors_orcid.csv
    # salieron de una corrida real (T-01, cerrado el 2026-08-01). Este bloque
    # decía `ejecutado_contra_api: false` mientras el archivo de datos probaba
    # lo contrario; se corrigió el 2026-08-19.
    #
    # Lo que sigue siendo cierto es que el ENTORNO DE DESARROLLO no tiene
    # salida a api.crossref.org, api.openalex.org ni pub.orcid.org. Por eso
    # todo conector se escribe con `--test` sin red y se ejecuta desde una
    # máquina con salida.
    implementado: true
    ejecutado_contra_api: true
    # Crossref pide identificarse con un correo de contacto para su 'polite pool'.
    mailto: "pablosanchezmonsalve@gmail.com"
    # Un ORCID asignado por coincidencia de apellido e inicial es una hipótesis.
    # Nunca se asigna si las iniciales se contradicen ni si hay homonimia dentro
    # de la misma publicación.
    exigir_inicial_coincidente: true
    colapso_automatico_de_conflictos: false
