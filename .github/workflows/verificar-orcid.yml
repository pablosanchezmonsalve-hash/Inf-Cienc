name: Verificar ORCID contra su registro

# Ejecuta la verificación de ORCID en GitHub, sin instalar nada en local.
#
# POR QUÉ EXISTE
#   El conector necesita Python, y no todos los equipos permiten instalarlo:
#   en un portátil administrado por la institución la instalación puede estar
#   bloqueada. El proyecto ya corre Python aquí para construir el sitio, así que
#   este paso puede correr en el mismo sitio.
#
#   Hay además una ventaja que no es sólo comodidad: las credenciales viven en
#   los secretos del repositorio, cifradas, en vez de pasar por una consola o
#   por un archivo local.
#
# ANTES DE LA PRIMERA EJECUCIÓN
#   Settings → Secrets and variables → Actions → New repository secret
#     ORCID_CLIENT_ID      APP-XXXXXXXXXXXX
#     ORCID_CLIENT_SECRET  el secret que entrega ORCID
#
# CÓMO SE LANZA
#   Pestaña Actions → «Verificar ORCID contra su registro» → Run workflow.

on:
  workflow_dispatch:
    inputs:
      limite:
        # Un campo vacío NO significa «sin límite»: GitHub sustituye el valor
        # por defecto y la ejecución vuelve a quedarse en 10 sin avisar. Hace
        # falta un valor que signifique «todas» de forma explícita.
        description: 'Cuántas firmas verificar. Escriba 0 para verificarlas todas'
        required: false
        # Por defecto, todas. Mientras el contrato de la API estaba sin probar
        # tenía sentido arrancar con 10; ahora está probado, y un 10 por
        # defecto sólo produce ejecuciones que parecen completas y no lo son.
        default: '0'
      commitear:
        description: '¿Guardar el resultado en el repositorio?'
        type: boolean
        required: false
        default: true

# Escritura, porque el resultado se versiona: es un dato costoso de reproducir
# —depende de consultar un servicio externo— y perderlo obligaría a repetirlo.
permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sin esto, checkout deja el repositorio en HEAD desacoplado —apuntando
          # a un commit, no a una rama— y el `git push` del paso final no sabe a
          # dónde empujar. La primera ejecución generó el resultado y lo subió
          # como artefacto, pero no lo guardó en el repositorio.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Antes de gastar una sola petición: si la lógica está rota, el problema
      # no son las credenciales y no tiene sentido consultarlas.
      - name: Probar la lógica sin red
        run: python3 src/enrich/orcid_api.py --test

      - name: Comprobar que hay credenciales
        env:
          ID: ${{ secrets.ORCID_CLIENT_ID }}
          SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: |
          if [ -z "$ID" ] || [ -z "$SECRET" ]; then
            echo "::error::Faltan los secretos ORCID_CLIENT_ID y ORCID_CLIENT_SECRET."
            echo "Añádalos en Settings -> Secrets and variables -> Actions."
            echo "Se obtienen gratis en https://orcid.org -> Developer tools."
            exit 1
          fi
          echo "Credenciales presentes (Client ID: ${ID:0:8}...)"

      - name: Auditoría
        run: python3 src/audit/run_all.py

      - name: Verificar contra el registro de ORCID
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
          LIMITE: ${{ inputs.limite }}
        run: |
          if [ -z "$LIMITE" ] || [ "$LIMITE" = "0" ]; then
            echo "Verificando TODAS las asignaciones."
            python3 src/enrich/orcid_api.py
          else
            echo "Verificando las primeras $LIMITE asignaciones."
            python3 src/enrich/orcid_api.py --limit "$LIMITE"
          fi

      # Siempre descargable, se comitee o no: si algo sale mal con el commit,
      # el resultado de las consultas no se pierde.
      - name: Publicar el resultado como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verificacion-orcid
          path: |
            data/enriched/orcid_verificacion.csv
            internal/orcid_hallazgos.csv
          if-no-files-found: ignore

      - name: Guardar el resultado en el repositorio
        if: ${{ inputs.commitear }}
        env:
          # Sustituir aquí en vez de interpolar `${{ }}` directo en `run:`
          # deja que el runtime de shell trate el valor como DATO, no como
          # texto de script: un input con comillas o `$(...)` no puede
          # cerrar la cadena ni ejecutarse.
          LIMITE: ${{ inputs.limite }}
          RAMA: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Uno por uno: `git add A B` falla entero si B no existe, y entonces
          # tampoco añade A. internal/orcid_hallazgos.csv sólo se genera cuando
          # hay asignaciones dudosas, así que a veces no existe.
          for f in data/enriched/orcid_verificacion.csv internal/orcid_hallazgos.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            ETQ=$([ "$LIMITE" = "0" ] && echo "todas" || echo "$LIMITE")
            git commit -m "Verificación de ORCID contra el registro público

          Ejecutado por el workflow «Verificar ORCID contra su registro».
          Límite: $ETQ."
            # Destino explícito: si el checkout dejara HEAD desacoplado, un
            # `git push` a secas fallaría sin decir a dónde intentaba ir.
            git push origin "HEAD:$RAMA"
          fi

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Verificación de ORCID"
            echo ""
            if [ -f data/enriched/orcid_verificacion.csv ]; then
              echo "| Veredicto | Firmas |"
              echo "|---|---:|"
              tail -n +2 data/enriched/orcid_verificacion.csv \
                | cut -d, -f3 | sort | uniq -c \
                | awk '{printf "| %s | %s |\n", $2, $1}'
              echo ""
              echo "Descargable en **Artifacts**, al final de esta página."
            else
              echo "No se generó ningún resultado. Revise el registro de los pasos."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
