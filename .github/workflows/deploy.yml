name: Construir, verificar y desplegar

# Reconstruye el sitio desde los datos versionados, lo verifica y lo publica en
# GitHub Pages.
#
# El pipeline es el mismo que en local (`make sitio`): auditoría → validación →
# artefactos → ensamblado. Si una regla bloqueante falla o si la verificación de
# capas encuentra material interno en un artefacto público, el job falla y NO se
# publica nada. Es la misma compuerta, ejecutada por CI.
#
# DOS DISPARADORES, UN SOLO JOB DE VERIFICACIÓN
#   La compuerta corría sólo al empujar a `main`, es decir DESPUÉS de fusionar:
#   ningún pull request se validaba antes de entrar, y el primero que rompiera
#   una regla bloqueante lo haría sobre la rama publicada. Ahora `construir`
#   corre también en `pull_request` y `desplegar` sigue atado a `main`, de modo
#   que se verifica lo mismo antes y después, y sólo se publica después.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cada job pide lo suyo. Antes esto vivía arriba y las dos mitades cargaban con
# permiso de escritura en Pages, incluidas las corridas de pull request, que no
# publican nada.
permissions:
  contents: read

concurrency:
  # Los despliegues se serializan bajo un grupo único y no se cancelan entre sí:
  # interrumpir una publicación a medias deja el sitio en un estado que nadie
  # eligió. Las corridas de pull request van a un grupo por rama y ahí sí se
  # cancela la anterior — de una rama que se empuja tres veces seguidas sólo
  # interesa el veredicto del último empujón.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sólo los usa `configure-pages`, y sólo en las corridas que publican.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      # El pre-renderizado ejecuta los constructores de marcado bajo Node. El
      # runner suele traerlo, pero «suele» no es una garantía: sin Node el build
      # NO falla —se degrada a un sitio que exige JavaScript— y en CI nadie lee
      # los avisos. Se fija la versión para que el despliegue sea determinista.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Auditoría y validación
        run: python3 src/audit/run_all.py

      - name: Factibilidad de indicadores
        run: python3 src/analysis/indicator_feasibility.py

      - name: Verificar la lógica de emparejamiento de ORCID
        run: python3 src/enrich/orcid_crossref.py --test

      # Autoprueba sin red del verificador contra el registro de ORCID. No pide
      # credenciales: si las pidiera, CI no podría ejercer esta lógica y se
      # rompería en silencio.
      - name: Verificar la lógica de verificación contra ORCID
        run: python3 src/enrich/orcid_api.py --test

      # Los dos conectores de ampliación, por lo mismo: su lógica decide qué
      # ORCID se atribuye a qué persona, y ninguna de esas decisiones debe
      # quedar sin una prueba que se ejecute en cada despliegue.
      - name: Verificar la lógica de ampliación desde el registro
        run: python3 src/enrich/orcid_expand.py --test

      - name: Verificar la lógica de candidatos por afiliación
        run: python3 src/enrich/orcid_afiliacion.py --test

      # Lo que decide qué firmas se fusionan como una persona y cuáles dejan de
      # contarse por no serlo. Es la lógica con más consecuencias sobre lo
      # publicado que existe fuera del pipeline, y hasta ahora no la ejercía
      # nada en CI.
      - name: Verificar la lógica de aplicación de decisiones humanas
        run: python3 src/review/apply_decisions.py --test

      - name: Construir artefactos publicables
        run: python3 src/build/build_all.py

      - name: Ensamblar el sitio
        run: python3 src/build/06_assemble_site.py

      # Un sitio que exige JavaScript para mostrar una cifra no es un informe
      # citable. Esto lo comprueba sobre el HTML desplegable, no sobre la
      # intención: si el pre-renderizado se saltó, el despliegue se detiene.
      - name: Comprobar que el sitio tiene contenido sin JavaScript
        run: |
          set -e
          for p in index impacto produccion colaboracion tematica; do
            grep -q 'data-prerender="1"' "dist/$p.html" \
              || { echo "FALLA: dist/$p.html no está pre-renderizado"; exit 1; }
          done
          grep -q '<svg class="chart"' dist/impacto.html \
            || { echo "FALLA: dist/impacto.html no trae ningún gráfico"; exit 1; }
          grep -q 'class="sello"' dist/impacto.html \
            || { echo "FALLA: dist/impacto.html no trae los sellos de procedencia"; exit 1; }
          echo "Contenido presente sin JavaScript — verificado"

      - name: Comprobar que la capa interna no viaja
        run: |
          set -e
          for prohibido in matching_log ambiguities_ orcid_conflicts identity_candidates; do
            if grep -rl "$prohibido" dist/ >/dev/null 2>&1; then
              echo "FALLA: '$prohibido' aparece en dist/"
              exit 1
            fi
          done
          test ! -d dist/internal
          test ! -d dist/data/raw
          echo "Capa interna ausente de dist/ — verificado"

      # La batería de `src/verify/`: contraste WCAG, estructura y consola,
      # flujos interactivos, responsive e higiene de CSS/JS. Existe en el
      # repositorio desde `D-137` y hasta ahora había que acordarse de correrla
      # a mano — que es la forma que tiene una verificación de no correrse.
      #
      # La versión se fija aquí y no en un package.json porque el sitio no tiene
      # dependencias de JavaScript y no va a tenerlas por una herramienta de
      # prueba. Es la misma con la que se verifica en local: una batería que
      # corre contra otro navegador no comprueba lo mismo.
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # Se invoca el guion directamente y no `make verificar`, que depende de
      # `sitio` y volvería a construirlo todo desde la auditoría. Aquí `dist/`
      # ya está construido por los pasos de arriba, y es justo ese `dist/` el
      # que hay que verificar, no otro reconstruido a su lado.
      - name: Verificar el sitio construido
        run: node src/verify/run_all.mjs dist

      - name: Publicar informes de verificación
        uses: actions/upload-artifact@v5
        with:
          name: informes-de-verificacion
          path: |
            docs/VALIDATION_REPORT.md
            docs/BUILD_VERIFICATION.md

      # ACTIVACIÓN MANUAL REQUERIDA, UNA SOLA VEZ:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # No se puede automatizar desde aquí. Se intentó `enablement: true` y el
      # runner respondió "Create Pages site failed: Resource not accessible by
      # integration": el GITHUB_TOKEN del workflow no tiene permiso para CREAR
      # el sitio de Pages, sólo para publicar en uno que ya existe. Haría falta
      # un token personal con permiso de administración, que no compensa
      # introducir para un paso que se hace una vez.
      #
      # Mientras Pages no esté activado, este paso falla con
      # "Get Pages site failed" y el resto del pipeline igual se ejecuta y
      # valida: lo único que no ocurre es la publicación.
      #
      # Los dos se saltan en pull request: `configure-pages` llama a la API de
      # Pages, que en una corrida de validación no tiene nada que configurar, y
      # subir el artefacto de un PR sólo serviría para que alguien lo confundiera
      # con lo publicado.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  desplegar:
    # Un pull request se construye y se verifica, pero no se publica. Es toda la
    # diferencia entre los dos disparadores.
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
